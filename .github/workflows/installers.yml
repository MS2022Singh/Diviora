name: Build installers
# Every push to main builds the Android APK and the Windows, macOS and Linux installers, then publishes them on
# the "latest" GitHub Release: https://github.com/MS2022Singh/Diviora/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: installers
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Where installers are published (decides the update URL built into the apps)
        id: pub
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.DIVIORA_RELEASES_REPO }}
        shell: bash
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then repo="${RELEASES_REPO:-MS2022Singh/Diviora-releases}"; else repo="${{ github.repository }}"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "DIVIORA_UPDATE_URL=https://github.com/$repo/releases/latest/download/version.json" >> "$GITHUB_ENV"
          echo "Update URL: https://github.com/$repo/releases/latest/download/version.json"
      - name: Build APK
        env:
          DIVIORA_CATALOG_URL: ${{ vars.DIVIORA_CATALOG_URL }}
          DIVIORA_DEV_PASSPHRASE: ${{ secrets.DIVIORA_DEV_PASSPHRASE }}
        run: |
          if [ -n "$DIVIORA_DEV_PASSPHRASE" ]; then echo "Developer unlock: enabled"; else echo "::warning::DIVIORA_DEV_PASSPHRASE secret is not set; developer options cannot be unlocked in this build"; fi
          if [ -n "$DIVIORA_CATALOG_URL" ]; then echo "Catalog: $DIVIORA_CATALOG_URL"; else echo "Catalog: bundled demo (DIVIORA_CATALOG_URL not set)"; fi
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/DIVIORA-Music-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, task: packageMsi, pattern: '*.msi', out: DIVIORA-Music-Windows.msi }
          # macos-latest (Apple Silicon) is often capacity-starved; the Intel build also runs on Apple Silicon via Rosetta.
          - { os: macos-15-intel, task: packageDmg, pattern: '*.dmg', out: DIVIORA-Music-macOS.dmg }
          - { os: ubuntu-latest, task: packageDeb, pattern: '*.deb', out: DIVIORA-Music-Linux.deb }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Where installers are published (decides the update URL built into the apps)
        id: pub
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.DIVIORA_RELEASES_REPO }}
        shell: bash
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then repo="${RELEASES_REPO:-MS2022Singh/Diviora-releases}"; else repo="${{ github.repository }}"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "DIVIORA_UPDATE_URL=https://github.com/$repo/releases/latest/download/version.json" >> "$GITHUB_ENV"
          echo "Update URL: https://github.com/$repo/releases/latest/download/version.json"
      - name: Unit tests and installer
        shell: bash
        env:
          DIVIORA_CATALOG_URL: ${{ vars.DIVIORA_CATALOG_URL }}
        run: ./gradlew --no-daemon -Pdiviora.skipAndroid=true :desktop:test :desktop:${{ matrix.task }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          f=$(find desktop/build/compose/binaries -name '${{ matrix.pattern }}' | head -1)
          cp "$f" "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
  publish:
    # Installers go to a PUBLIC releases repository so users can download them while this code repo stays private.
    # Setup (once): create the public repo MS2022Singh/Diviora-releases and add a fine-grained token with
    # "Contents: read and write" on it as the secret RELEASES_TOKEN. Without the token, this repo's own Releases is used.
    needs: [android, desktop]
    # Publish only when every installer built, so a stuck runner never removes a file.
    if: needs.android.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Choose where to publish
        id: target
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.DIVIORA_RELEASES_REPO }}
        run: |
          name=$(grep '^diviora.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^diviora.versionCode=' gradle.properties | cut -d= -f2)
          if [ -n "$RELEASES_TOKEN" ]; then repo="${RELEASES_REPO:-MS2022Singh/Diviora-releases}"; else
            repo="${{ github.repository }}"; echo "::warning::RELEASES_TOKEN not set: publishing to this repository's Releases (users cannot download them if it is private)"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Publishing $name ($code) to $repo"
      - name: Write version.json (apps read it to offer updates)
        run: |
          base="https://github.com/${{ steps.target.outputs.repo }}/releases/latest/download"
          notes=$(awk '/^## \[/{n++} n==3{exit} n==2' CHANGELOG.md | tail -n +2 | head -40 | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip()))')
          cat > dist/version.json <<JSON
          {"versionCode": ${{ steps.target.outputs.code }}, "versionName": "${{ steps.target.outputs.name }}", "notes": $notes,
           "android": "$base/DIVIORA-Music-Android.apk", "windows": "$base/DIVIORA-Music-Windows.msi",
           "macos": "$base/DIVIORA-Music-macOS.dmg", "linux": "$base/DIVIORA-Music-Linux.deb",
           "page": "https://github.com/${{ steps.target.outputs.repo }}/releases/latest"}
          JSON
          python3 -c 'import json;print(json.load(open("dist/version.json")))'
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.target.outputs.repo }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: v${{ steps.target.outputs.name }}
          name: DIVIORA Music ${{ steps.target.outputs.name }}
          make_latest: true
          body: |
            ## Download
            | Device | File |
            |---|---|
            | Android phone / tablet | **DIVIORA-Music-Android.apk** |
            | Windows 10 / 11 | **DIVIORA-Music-Windows.msi** |
            | macOS | **DIVIORA-Music-macOS.dmg** |
            | Linux (Ubuntu/Debian) | **DIVIORA-Music-Linux.deb** |

            **Android:** tap the APK → Open → (if asked) Settings → Allow from this source → Install.
            **Windows:** open the .msi → if "Windows protected your PC": More info → Run anyway → Install.
            **macOS:** open the .dmg → drag to Applications → first time: right-click → Open.
            **Linux:** `sudo apt install ./DIVIORA-Music-Linux.deb`

            Already installed? DIVIORA offers this update by itself (Home → "Update available").
          files: dist/*
      - name: Publish the download page README
        if: steps.target.outputs.repo != github.repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          sha=$(gh api "repos/$REPO/contents/README.md" --jq .sha 2>/dev/null || true)
          content=$(sed "s#github.com/${{ github.repository }}/releases#github.com/$REPO/releases#g" docs/INSTALL.md | base64 -w0)
          if [ -n "$sha" ]; then gh api -X PUT "repos/$REPO/contents/README.md" -f message="Install guide" -f content="$content" -f sha="$sha" > /dev/null
          else gh api -X PUT "repos/$REPO/contents/README.md" -f message="Install guide" -f content="$content" > /dev/null; fi
