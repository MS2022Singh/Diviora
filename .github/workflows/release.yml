name: Google Play bundle
# Builds the Google Play version (AAB, no self-update), signed with your PRIVATE upload key.
# Run it from Actions → "Google Play bundle" → Run workflow. Needs secrets:
#   DIVIORA_KEYSTORE_BASE64, DIVIORA_KEYSTORE_PASSWORD, DIVIORA_KEY_ALIAS, DIVIORA_KEY_PASSWORD
# Optional: PLAY_SERVICE_ACCOUNT_JSON (uploads to the chosen Play track automatically).
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON): internal, alpha (closed), beta (open), production, or none'
        default: 'none'
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Decode private upload key
        env:
          KS: ${{ secrets.DIVIORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::DIVIORA_KEYSTORE_BASE64 secret missing: create your upload key first (developer guide, Google Play)"; exit 1; fi
          echo "$KS" | base64 -d > release.jks
      - name: Build signed AAB
        env:
          DIVIORA_KEYSTORE_PASSWORD: ${{ secrets.DIVIORA_KEYSTORE_PASSWORD }}
          DIVIORA_KEY_ALIAS: ${{ secrets.DIVIORA_KEY_ALIAS }}
          DIVIORA_KEY_PASSWORD: ${{ secrets.DIVIORA_KEY_PASSWORD }}
          DIVIORA_CATALOG_URL: ${{ vars.DIVIORA_CATALOG_URL }}
          DIVIORA_DEV_PASSPHRASE: ${{ secrets.DIVIORA_DEV_PASSPHRASE }}
          DIVIORA_CONTENT_KEY: ${{ secrets.DIVIORA_CONTENT_KEY }}
        run: |
          ./gradlew --no-daemon :app:bundlePlayRelease
          mkdir -p out && cp app/build/outputs/bundle/playRelease/app-play-release.aab out/DIVIORA-Music-Play.aab
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with: { name: play-bundle, path: out/* }
      - name: Upload to Google Play
        if: ${{ inputs.track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.diviora.music
          releaseFiles: out/DIVIORA-Music-Play.aab
          track: ${{ inputs.track }}
          status: draft
