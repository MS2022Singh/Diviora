name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (optional)
        if: ${{ env.KS != '' }}
        env: { KS: '${{ secrets.DIVIORA_KEYSTORE_BASE64 }}' }
        run: echo "$KS" | base64 -d > release.jks
      - name: Build
        env:
          DIVIORA_KEYSTORE_PASSWORD: ${{ secrets.DIVIORA_KEYSTORE_PASSWORD }}
          DIVIORA_KEY_ALIAS: ${{ secrets.DIVIORA_KEY_ALIAS }}
          DIVIORA_KEY_PASSWORD: ${{ secrets.DIVIORA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
