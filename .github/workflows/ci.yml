name: CI
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Unit tests, lint, debug build (Android + desktop)
        run: ./gradlew --no-daemon check assembleGithubDebug :desktop:test
      - uses: actions/upload-artifact@v4
        with:
          name: diviora-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
